<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossword Puzzle</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Random Crossword Puzzle</h1>
    
    <div id="hints-container">
        <div id="across-hints">
            <h2>Across Hints</h2>
            <ul id="across-hint-list"></ul>
        </div>
        <div id="down-hints">
            <h2>Down Hints</h2>
            <ul id="down-hint-list"></ul>
        </div>
    </div>

    <div id="puzzle-container">
        <table id="crossword"></table>
    </div>

    <div id="words-container">
        <h2>Words (for testing)</h2>
        <div id="across-words"></div>
        <div id="down-words"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
